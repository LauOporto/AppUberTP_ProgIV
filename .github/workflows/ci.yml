name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Lint, Build & Tests (RT-07)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Base real para los tests de integración y concurrencia (Bloque 8)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uber_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: uber_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uber_user -d uber_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Los tests usan automáticamente la base "uber_db_test" (la crean y migran en globalSetup)
      DATABASE_URL: postgresql://uber_user:ci_only_password@localhost:5432/uber_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Restore Dependencies
        run: npm ci

      - name: Compile / Type Check TypeScript
        run: npm run build

      - name: Run Automated Tests (RT-06)
        run: npm test

  frontend-ci:
    name: Frontend Lint & Build (RT-07)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Restore Dependencies
        run: npm ci

      - name: Build React + Vite Production Bundle
        run: npm run build
