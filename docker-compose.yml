version: '3.8'

services:
  # Base de Datos Transaccional Primaria (RT-02: Proveedor 1 - PostgreSQL)
  postgres-db:
    image: postgres:16-alpine
    container_name: uber_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-uber_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env (cp .env.example .env)}
      POSTGRES_DB: ${DB_NAME:-uber_db}
    ports:
      # Puerto del host configurable: si ya hay un PostgreSQL local en 5432, usar DB_PORT=5433 en .env
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uber_user} -d ${DB_NAME:-uber_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proveedor de Datos Secundario para Presencia/Realtime (RT-02: Proveedor 2 - Redis)
  redis-cache:
    image: redis:7-alpine
    container_name: uber_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (Node.js + Express + TypeScript + Socket.io)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uber_backend_api
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-uber_user}:${DB_PASSWORD:?Falta DB_PASSWORD en .env}@postgres-db:5432/${DB_NAME:-uber_db}
      REDIS_URL: redis://redis-cache:6379
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}

  # Frontend Web (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uber_frontend_web
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_SOCKET_URL: http://localhost:3000

volumes:
  postgres_data:
  redis_data:
